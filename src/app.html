<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="text-scale" content="scale" />
        %sveltekit.head%
        <script>
            // Espelha o initTheme, só que antes: sem isto a tela de boot pinta no tema
            // claro até o layout raiz rodar.
            document.documentElement.dataset.theme =
                localStorage.getItem("tukro-theme") ??
                (matchMedia("(prefers-color-scheme: dark)").matches ? "retro-dark" : "retro-light");
        </script>
        <style>
            /*
                Tela de boot, no ar enquanto o layout raiz espera o /me. Ela vive
                aqui, em CSS puro, porque neste ponto nem o Svelte nem as classes
                do Tailwind do app estão rodando ainda.
            */
            #boot {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 1rem;
                background-color: var(--tukro-canvas);
                font-family: system-ui, sans-serif;
            }

            .boot-mark {
                font-size: 1.5rem;
                font-weight: 700;
                letter-spacing: -0.025em;
                text-transform: lowercase;
                color: var(--tukro-content);
            }

            .boot-mark::first-letter {
                color: var(--tukro-accent);
            }

            .boot-spinner {
                width: 2rem;
                height: 2rem;
                border-radius: 9999px;
                border: 2px solid var(--tukro-line);
                border-top-color: var(--tukro-primary);
                animation: boot-spin 0.8s linear infinite;
            }

            @keyframes boot-spin {
                to {
                    transform: rotate(360deg);
                }
            }

            @media (prefers-reduced-motion: reduce) {
                .boot-spinner {
                    animation: none;
                }
            }
        </style>
    </head>

    <body data-sveltekit-preload-data="hover">
        <div id="boot" role="status" aria-label="Carregando">
            <p class="boot-mark">tukro</p>
            <span class="boot-spinner"></span>
        </div>
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>
